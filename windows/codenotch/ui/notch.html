<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:#000;
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid #2e2e2e;border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  #pill{--fillet:26px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring-bg,.ringwrap > svg.ring-fg{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .ringwrap > svg.ring-fg{pointer-events:none} /* the track/arc paint on top of a full-bleed photo icon; clicks still fall through to the pill */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:#e8e8ea}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png,.glyph img.gif{width:54px;height:54px;object-fit:cover;border-radius:50%} /* 1px shy of the 56px box so the circle never peeks past the ring's outer edge at r=27.5 */
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .pct-weekly{font-size:10px;color:#808080;font-variant-numeric:tabular-nums;margin-top:-2px}
  .dim{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Working = a real ring-of-fire GIF behind the glyph (see renderRing's bigFlame); it animates on
     its own, so no CSS keyframes are needed here. */
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:100px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:#0a0a0a;border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:69px;width:32px;height:36px;background:#0a0a0a;display:none;
    clip-path:path('M0 0C0 9 18.56 13.68 32 18C18.56 22.32 0 27 0 36Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:#808080}
  .g-head{font-size:12px;font-weight:700;color:#e8e8ea;margin-top:12px}
  .g-box{border:1px solid #242424;border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:#808080;padding:2px 0}

  /* ---- System block: CPU, memory, disk and internet under (or after) the provider rings ----
     A .cell of its own (data-p="system") so hover, the card tail, the hot rectangles, drag and click treat it
     like a ring. Every width and height below is fixed on purpose: the numbers tick once a second and a
     size that followed them would move the pill under the cursor. */
  .sys{width:56px;gap:8px;align-items:stretch;padding-top:12px;border-top:1px solid #1e1e1e}
  .sys[hidden]{display:none}
  .sys.stale .sm{opacity:.45} /* the sampler idles while the notch is hidden: old numbers must not pass for live ones */
  .sm{width:56px}
  .sm-t{display:flex;justify-content:space-between;align-items:baseline;line-height:14px}
  .sm-l{font-size:9px;font-weight:600;letter-spacing:.4px;color:#808080}
  .sm-v{font-size:11px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  .sm-b{height:3px;border-radius:2px;background:#2d2d2d;margin-top:3px;overflow:hidden}
  .sm-b i{display:block;height:100%;width:0;border-radius:2px}
  .sm-n{display:flex;align-items:baseline;gap:3px;height:14px;font-size:11px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
  .sm-n i{font-style:normal;font-size:10px;font-weight:400;color:#808080}
  .sm-net.off .sm-n{color:#808080;font-weight:400}
  .sm-net.off i{display:none}
  .sm-net.testing i{color:#00FF88} /* a speed test is running (the tray can start one with nothing else on screen): its traffic is what the numbers show */
  /* Hover card */
  .c-head .sysg{width:16px;height:16px;flex:none;color:#e8e8ea}
  .w-val{font-size:12px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:6px;height:6px;border-radius:3px;margin-right:6px;vertical-align:1px}
  .spark{display:block;width:100%;height:20px;margin-top:5px;border-bottom:1px solid #242424;overflow:visible}
  .spark path{fill:none;stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .spark .sp-l{stroke:currentColor}
  .spark .sp-l2{stroke:#808080}
  .spark .sp-a{fill:currentColor;stroke:none;opacity:.14}
  .st-res{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:11px;color:#e8e8ea;font-variant-numeric:tabular-nums;white-space:nowrap}
  .w-used.err{color:#FF3F00;margin-top:4px}
  .lnk{font-size:11px;color:#e8e8ea;text-decoration:underline;text-decoration-color:#555;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
  .lnk:hover{color:#fff;text-decoration-color:#fff}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so what stays black
     is the concave arc between the two. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 20px 20px 0;border-right:1px solid #2e2e2e;border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #card{left:100px;right:10px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:69px;clip-path:path('M32 0C32 9 13.44 13.68 0 18C13.44 22.32 32 27 32 36Z')}

  /* Top and bottom: the pill lies flat, so it is a row and its thickness comes from the cells rather
     than a fixed 70 px column. The card is centred under (or over) the hovered ring by `placeCard`. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12px 18px;
  }
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 20px 20px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:20px 20px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px))}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. 246 is the upstream cap either way. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:246px;max-height:calc(100% - 150px);
  }
  /* The System block lies flat too: a 2 x 2 group after the rings, cut off by a vertical hairline. Two columns
     rather than one row of four keep five rings plus the block inside the 720 px window. */
  body[data-edge="top"] .sys:not([hidden]),body[data-edge="bottom"] .sys:not([hidden]){
    display:grid;grid-template-columns:repeat(2,56px);gap:8px 12px;align-items:center;width:auto;
    padding:0 0 0 14px;border-top:none;border-left:1px solid #1e1e1e;
  }
  body[data-edge="top"] .sys[data-n="1"],body[data-edge="bottom"] .sys[data-n="1"]{grid-template-columns:56px}
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:36px;height:32px}
  body[data-edge="top"] #tail{clip-path:path('M0 32C9 32 13.68 13.44 18 0C22.32 13.44 27 32 36 32Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C9 0 13.68 18.56 18 32C22.32 18.56 27 0 36 0Z')}
</style>

       #sys is never rebuilt by renderRing: it only inserts and removes the provider cells in front of it. -->

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
// The status arc is neutral on purpose: the ring behind it is coloured by how much of the limit
// is gone, and a green arc inside it reads as part of that scale. Waiting borrows the warning yellow.
const TRACK='#303030', INK='#ffffff', DIM='#808080';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;
// Whole percents, except where rounding would read as nothing used or nothing left, as the Mac's Percent does
function smallPct(v){
  if(v<=0) return '0';
  const t=Math.round(v*10)/10;
  if(t<0.1) return '<0.1';
  if(t>99.9) return '>99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }
// Both ends, since vendors disagree on which they print; the left half comes from the rounded used half, as their dashboards do
function usedCopy(w){
  const v=w.used*100;
  let used, left;
  if((v>0&&v<1)||(v>99&&v<100)){ used=smallPct(v); left=100-v>99.9?'>99.9':smallPct(Math.max(0,100-v)); }
  else { const u=Math.round(v); used=String(u); left=String(Math.max(0,100-u)); }
  if(w.derived) used='~'+used;
  return ui().usedLeft(used,left);
}

/* Which screen edge the notch is pinned to. Rust owns it (it is what placed the window); the page is
   told so it can mirror or rotate itself to match. 'right' is the default and the pre-edge layout. */
let notchEdge='right';
function edgeIsVertical(){ return notchEdge==='left'||notchEdge==='right'; }
function applyEdge(e){
  const next=(e==='left'||e==='top'||e==='bottom')?e:'right';

  document.body.dataset.edge=next;

function ui(){return UI[uiLang]||UI.en;}
function textCopy(value){
  if(!value) return '';
  const table=TEXT[uiLang];
  if(!table) return value;
  if(table[value]) return table[value];
  let out=String(value);
  for(const [re,to] of PATTERNS[uiLang]||[]) out=out.replace(re,to);
  return out;
}
function setUiLanguage(lang){
  const next=TEXT[lang]?lang:'en';

}
// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}
// Provider table (order = top to bottom in the pill). `glyph` is the fallback letter used when no mark is available
// Which providers get a ring: [{provider}]. null or an empty list means every provider.
let notchSlots=null;
function slotFor(id){
  if(!Array.isArray(notchSlots)) return null;
  for(const s of notchSlots){ if(s&&s.provider===id) return s; }
  return null;
}
function providers(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(grokSnap.status!=='absent') list.push({id:'grok',name:'Grok',glyph:'Gk',snap:grokSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(Array.isArray(notchSlots)&&notchSlots.length){
    const picked=list.filter(p=>!!slotFor(p.id));
    // Never leave the notch with nothing in it: an empty result means the choice no longer matches
    // any available provider, so fall back to showing everything rather than an empty pill.
    if(picked.length) return picked;
  }
  return list;
}
// Antigravity's "Notch reads" and "Model data", as in the Mac app; chosen in settings
let agPrefs={limit:'automatic',model:'gemini'};
// Where the weekly limit's own ring goes, from settings: 'off', 'inside' or 'outside'
let weeklyRing='off';
// The tightest metered window, ties going to the lower id so the choice never flickers
function tightestOf(ws){
  return ws.filter(w=>w.count==null).reduce((a,b)=>!a||b.used>a.used||(b.used===a.used&&b.id<a.id)?b:a,null);
}
function laneFamily(w){ const id=w.id.toLowerCase(); return id.startsWith('gemini')?'gemini':(id.startsWith('3p')||id.startsWith('claude'))?'3p':''; }
function laneIs(w,limit){
  const t=(w.id+' '+w.label).toLowerCase();
  return limit==='weekly'?t.includes('weekly'):['5h','5-hour','five hour','five-hour','hourly','session'].some(k=>t.includes(k));
}
// The window a provider's ring shows: the same rule as ring_window in main.rs, which draws the tray
function headlineOf(snap,id){
  const ws=snap.windows; if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude') return byId('session');
  if(id==='codex') return ws[0];
  if(id==='cursor') return byId('included')||byId('api');
  if(id==='grok') return byId('credits')||ws[0];
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  if(agPrefs.limit!=='automatic'){ const w=tightestOf(lanes.filter(w=>laneIs(w,agPrefs.limit))); if(w) return w; }
  return tightestOf(lanes.filter(w=>w.used<1))||tightestOf(lanes)||lanes[0];
}
// The weekly window each provider reports, or null where there is none: Claude names it seven_day,
// Codex calls its second window secondary, and Antigravity has one per model family. Cursor has none.
function weeklyOf(snap,id){
  const ws=snap.windows.filter(w=>w.count==null); if(!ws.length) return null;
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude') return byId('seven_day')||byId('weekly_all')||byId('weekly');
  if(id==='codex') return byId('secondary');
  if(id==='cursor') return null;
  if(id==='grok') return null; // the credits window is already the weekly one
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  return tightestOf(lanes.filter(w=>laneIs(w,'weekly')));
}
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>5*60*1000; }
let stateSnap={sessions:[],agg:'idle'};

function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="butt"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function renderRing(){
  const ps=providers();
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor)
  const want=ps.map(p=>p.id+':'+(glyphs[p.id]?glyphs[p.id].kind:'-')).join(',');
  if(pill.dataset.cells!==want){
    // The System block (#sys) stays put; only the provider cells in front of it are swapped
    for(const old of pill.querySelectorAll('.cell:not(.sys)')) old.remove();
    sysEl.insertAdjacentHTML('beforebegin',ps.map(p=>`<div class="cell" data-p="${p.id}">
      <div class="ringwrap"><svg class="ring-bg" viewBox="0 0 56 56"></svg><div class="glyph ${(!glyphs[p.id]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div><svg class="ring-fg" viewBox="0 0 56 56"></svg></div>
      <div class="pct">—</div><div class="pct-weekly"></div></div>`).join(''));
    pill.dataset.cells=want;
  }
  for(const p of ps){
    const cell=pill.querySelector(`.cell[data-p="${p.id}"]`); if(!cell) continue;
    const bg=cell.querySelector('svg.ring-bg'), fg=cell.querySelector('svg.ring-fg'), pct=cell.querySelector('.pct'), pctWeekly=cell.querySelector('.pct-weekly'), glyph=cell.querySelector('.glyph'), wrap=cell.querySelector('.ringwrap');
    const h=headlineOf(p.snap,p.id);
    // Backdrop disc stays behind the glyph (fills the gap around a small SVG mark); the track, the
    // progress arc and the working indicator are drawn in ring-fg, in front of the glyph, so a
    // full-bleed photo/gif icon still shows them as a rim instead of being covered by it.
    const ws=workState(p.id);
    // A real ring-of-fire GIF sits BEHIND the glyph, centred on the ring and sized past the photo's
    // edge so its flame shows all the way around; the photo covers the GIF's own black hole.
    const bigFlame=ws==='running' ? `<image href="fire-ring.gif" x="-11" y="-11" width="78" height="78"/>` : '';
    bg.innerHTML=`<circle cx="28" cy="28" r="22" fill="#2a2a2a"/>${bigFlame}`;
    let inner=`<circle cx="28" cy="28" r="25" fill="none" stroke="${TRACK}" stroke-width="5"/>`;
    if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
    if(weeklyRing!=='off'){ // the week, thinner and at its own radius, in its own colour: a session at 12% beside a week at 91% is the case this exists for
      const wk=weeklyOf(p.snap,p.id);
      // Inside, it shares the gap with the working indicator, so it stands down while that is showing
      const taken=weeklyRing==='inside'&&ws!=='idle';
      if(wk&&(!h||wk.id!==h.id)&&!taken){
        const r=weeklyRing==='inside'?16:31;
        inner+=`<circle cx="28" cy="28" r="${r}" fill="none" stroke="${TRACK}" stroke-width="2.4" opacity="0.7"/>`
          +svgArc(r,Math.min(wk.used,1),tone(wk.used),2.4,'opacity="0.85"');
      }
    }
    { // thin inner arc: the big flame in ring-bg already says "working"; only "waiting on you" still needs a mark here
      if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${WATCH}" stroke-width="2.5"/></g>`;
    }
    fg.innerHTML=inner;
    if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+h.count;
    else if(h) pct.textContent=(h.derived?'~':'')+pctText(h.used)+'%';
    else pct.textContent=p.snap.windows.length?'—':'…'; // its declared window is missing: a dash, not a wait
    // Second line under the headline number: the same provider's weekly reading, so a full session
    // (or five-hour window) at a glance does not hide a week that is quietly running out.
    const wk=weeklyOf(p.snap,p.id);
    pctWeekly.textContent=(wk && wk.count==null) ? (wk.derived?'~':'')+pctText(wk.used)+'%' : '';
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('dim', staleOf(p.snap));
  }

}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return ui().ago(m);
}

const STATE_DOT={running:INK,attention:WATCH,done:AMPLE,idle:TRACK};
// The card is clipped, not scrolled, so rows past this would push its title off the top; the rest are counted, as on the Mac
const SESSION_ROWS=5;
function moreRow(n){ return n>0?`<div class="s-more">${ui().andMore(n)}</div>`:''; }

let hoverId='claude';
function renderCard(){
  const c=document.getElementById('card');
  if(hoverId==='system'){
    if(sysMetrics.length){ renderSysCard(); placeCard(); noteCardSize(); return; }
    hoverId=providers()[0].id; // the block was switched off while it was hovered
  }
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  let html=`<div class="c-head">${headIcon}<span class="c-title">${ui().title(p.name)}</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">${textCopy('Updated')} ${ago(snap.fetched_at)}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',grok:'Run grok login to see usage.',gemini:'Sign in to Antigravity to see usage.'}[p.id]||'';
    html+=`<div class="c-note">${textCopy(who)}<br>${esc(textCopy(snap.note||''))}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(textCopy(snap.note||'Waiting for first reading…'))}</div>`;
  }else{
    // Windows that share a group (Antigravity's model families) sit in one box under its name, as on the Mac
    let group=null;
    for(const w of snap.windows){
      if((w.group||null)!==group){
        if(group) html+=`</div>`;
        group=w.group||null;
        if(group) html+=`<div class="g-head">${esc(textCopy(group))}</div><div class="g-box">`;
      }
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} ${textCopy(w.count===1?'request today':'requests today')}`:textCopy('no requests today')}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${esc(usedCopy(w))}</div>
      </div>`;
    }
    if(group) html+=`</div>`;
    if(snap.note) html+=`<div class="c-note">${esc(textCopy(snap.note))}</div>`;
  }
  if(p.id==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,SESSION_ROWS)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=moreRow(act.length-SESSION_ROWS)+`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    // Waiting before busy, newest first within each, so what gets cut is what matters least
    const acts=activity.filter(a=>a.provider===p.id).sort((a,b)=>(b.state==='waiting')-(a.state==='waiting')||b.since-a.since);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,SESSION_ROWS)){
        const col=a.state==='waiting'?WATCH:INK;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(textCopy(a.detail))}</span></div>`;
      }
      html+=moreRow(acts.length-SESSION_ROWS)+`</div>`;
    }
  }
  c.innerHTML=html;
  sysSig=''; // the System card's cached nodes are gone
  placeCard();
}
// The card follows the hovered cell: centred on it along the pill (kept inside the window), tail pointing at it.
// On the upright edges that means matching its vertical centre; on the flat ones, its horizontal centre,
// and the card is pushed clear of a pill whose thickness follows the cells it holds.
function placeCard(){
  // With fitZoom active a rectangle comes back in zoomed pixels while style.top/left are set in unzoomed ones
  const k=parseFloat(document.documentElement.style.zoom)||1;
  const box=el=>{ const r=el.getBoundingClientRect(); return {left:r.left/k,top:r.top/k,right:r.right/k,bottom:r.bottom/k,width:r.width/k,height:r.height/k}; };
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=box(cell);
  // The point sits on the ring, not the cell, which includes the label below it
  const rr=box(cell.querySelector('.ringwrap')||cell);
  card.style.transform='none';
  if(edgeIsVertical()){
    const cy=cr.top+cr.height/2;
    const H=innerHeight/k, ch=card.offsetHeight||0;
    let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
    card.style.top=top+'px'; card.style.left='';
    const ry=rr.top+rr.height/2;
    const th=tail.offsetHeight||36, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));
    tail.style.top=Math.round(ty-th/2)+'px'; tail.style.left='';
  }else{
    const pr=box(pill);
    const cx=cr.left+cr.width/2;
    const W=innerWidth/k, cw=card.offsetWidth||0, ch=card.offsetHeight||0;
    let left=Math.round(cx-cw/2); left=Math.max(8,Math.min(left,W-cw-8));
    card.style.left=left+'px';
    const rx=rr.left+rr.width/2;
    const tw=tail.offsetWidth||36, tx=Math.max(left+16+tw/2,Math.min(left+cw-16-tw/2,rx));
    tail.style.left=Math.round(tx-tw/2)+'px';
    // 30 px of clear gap, the same the upright edges leave, with the tail spanning it 1 px under the pill
    if(notchEdge==='top'){ card.style.top=Math.round(pr.bottom+30)+'px'; tail.style.top=Math.round(pr.bottom-1)+'px'; }
    else{ card.style.top=Math.round(pr.top-30-ch)+'px'; tail.style.top=Math.round(pr.top-31)+'px'; }
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill'), tail=document.getElementById('tail');

// Nothing is broadcast when the Windows clock format changes, so ask again each time the card opens

}

/* ===== System block: processor, memory, disk and internet =====

const SYS_IDS=['cpu','ram','disk','net'];

const SYS_DRIVE_ROWS=2; // other drives listed on the card
// The speed test writes its errors in English (speedtest.rs), and they are few and fixed: a Portuguese card would otherwise
// show half a sentence in English. Same table in settings.html.
const PT_SPEED_ERRORS=[

  [/^(download|upload) measurement failed$/,'Não foi possível medir o $1'],

// Only these two languages are written out; every other one shows English, as the settings page does
const SYS={

      down:'Download',up:'Upload',offline:'Sem conexão de rede',pillOffline:'sem rede',

function sysText(k,...a){

const sysEl=document.getElementById('sys');
let sysMetrics=[]; // empty until Rust answers, so a build without the sampler shows no block instead of dashes for ever
let sysSnap={cpu:null,ram:null,disk:null,net:null};
let sysAt=0; // when the last live sample arrived, by this page's clock
let speedSnap=null; // null = no answer yet (or a build without the speed test): the card then omits that part
let sysHist=[], sysHistAt=0; // last SYS_HISTORY samples, oldest first; null = a gap where the sampler idled
let sysRefs={}; // the pill's nodes, by metric
let sysSig='', sysEls={}; // the card's markup as last written, and its slots
let cardSize=''; // the card's size when the hot rectangles were last reported

// ---- Payloads: whatever arrives is checked field by field, and a bad field reads as "no data" ----
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const numOrNull=v=>typeof v==='number'&&isFinite(v)&&v>=0?v:null;
const fracOrNull=v=>typeof v==='number'&&isFinite(v)?Math.min(1,Math.max(0,v)):null;
const strOr=(v,d='')=>typeof v==='string'?v:d;
function normSys(p){
  if(!isObj(p)) return null;
  const {cpu,ram,disk,net}=p;
  return {
    cpu: isObj(cpu)&&fracOrNull(cpu.frac)!=null ? {frac:fracOrNull(cpu.frac),name:strOr(cpu.name),threads:numOrNull(cpu.threads)} : null,
    ram: isObj(ram)&&fracOrNull(ram.frac)!=null ? {frac:fracOrNull(ram.frac),used:numOrNull(ram.used),total:numOrNull(ram.total)} : null,
    disk: isObj(disk)&&fracOrNull(disk.frac)!=null ? {
      drive:strOr(disk.drive),kind:strOr(disk.kind),frac:fracOrNull(disk.frac),used:numOrNull(disk.used),total:numOrNull(disk.total),
      busy:fracOrNull(disk.busy),read:numOrNull(disk.read_bytes_s),write:numOrNull(disk.write_bytes_s),
      others:(Array.isArray(disk.others)?disk.others:[]).filter(o=>isObj(o)&&fracOrNull(o.frac)!=null).slice(0,4)
        .map(o=>({drive:strOr(o.drive),frac:fracOrNull(o.frac),used:numOrNull(o.used),total:numOrNull(o.total)})),
    } : null,
    net: isObj(net) ? {connected:net.connected===true,kind:strOr(net.kind),name:strOr(net.name),
      down:numOrNull(net.down_bytes_s),up:numOrNull(net.up_bytes_s),link:numOrNull(net.link_bits_s)} : null,
  };
}
function normSpeed(p){
  if(!isObj(p)) return null;
  const last=isObj(p.last)&&numOrNull(p.last.down_bits_s)!=null&&numOrNull(p.last.up_bits_s)!=null&&numOrNull(p.last.at)!=null
    ? {at:p.last.at,down:p.last.down_bits_s,up:p.last.up_bits_s,ms:numOrNull(p.last.latency_ms)} : null;
  return {
    state:['idle','running','done','error'].includes(p.state)?p.state:'idle',phase:strOr(p.phase),
    progress:fracOrNull(p.progress)||0,live:numOrNull(p.live_bits_s),ms:numOrNull(p.latency_ms),
    down:numOrNull(p.down_bits_s),up:numOrNull(p.up_bits_s),last,error:typeof p.error==='string'&&p.error?p.error:null,
  };
}

// ---- Numbers, in the language's own decimal mark ----
const nfCache={};
function nf(v,max,min=max){
  const loc=ui().locale, k=loc+max+min;
  try{ return (nfCache[k]||(nfCache[k]=new Intl.NumberFormat(loc,{minimumFractionDigits:min,maximumFractionDigits:max}))).format(v); }
  catch(e){ return v.toFixed(max); }
}
const sig3=v=>v===0?nf(0,0):nf(v,v>=100?0:v>=10?1:2); // an exact zero is "0", not "0,00"
function bitsRate(bits){ // "84,3 Mb/s"
  let v=bits/1e3, u=0; const U=['Kb/s','Mb/s','Gb/s'];
  while(v>=999.5&&u<2){ v/=1000; u++; }
  return sig3(v)+' '+U[u];
}
function linkSpeed(bits){ // "1,2 Gb/s", "867 Mb/s": a nominal figure, so no trailing zeros
  let v=bits/1e6, u=0; const U=['Mb/s','Gb/s'];
  if(v>=999.5){ v/=1000; u=1; }
  return nf(v,v>=100?0:1,0)+' '+U[u];
}
function bitsCompact(bytesPerS){ // the pill's ~56 px: "84 M", "1,2 M"
  let v=bytesPerS*8/1e3, u=0; const U=['K','M','G'];
  for(;;){
    const r=v>=10?Math.round(v):Math.round(v*10)/10;
    if(r>=1000&&u<2){ v/=1000; u++; continue; }
    return nf(r,Number.isInteger(r)?0:1)+' '+U[u];
  }
}
const byteRate=b=>{ const v=b/1e6; return nf(v,v>=10?0:1,0)+' MB/s'; };
function fmtSize(b){
  const U=['B','KB','MB','GB','TB']; let v=b, i=0;
  while(v>=1024&&i<4){ v/=1024; i++; }
  return nf(v,i>=4?2:(i>=3&&v<100)?1:0)+' '+U[i];
}
const pctInt=f=>Math.round(f*100)+'%';
function agoText(ms){ // the last test is kept across restarts, so it can be days old, and "300h ago" says nothing
  const m=Math.floor((Date.now()-ms)/60000);
  if(m>=2880) return new Date(ms).toLocaleDateString(ui().locale,{month:'short',day:'numeric'});
  // ui().ago rounds hours to the nearest, so 1 h 40 min read "2 h"; the settings page counts whole hours, and both must give the same age
  return m<1?sysText('justNow'):ui().ago(m<60?m:Math.floor(m/60)*60);
}
const cpuName=n=>n.replace(/\((R|TM)\)/g,'').replace(/\s+/g,' ').trim(); // "13th Gen Intel(R) Core(TM) i7" reads as noise
const diskWord=d=>d&&d.kind==='ssd'?'SSD':d&&d.kind==='hdd'?'HDD':'DISK';

// ---- History and sparklines ----
function pushHist(s){
  const now=Date.now();
  if(sysHistAt&&now-sysHistAt>3500) sysHist.push(null); // the sampler idled: break the line instead of joining across the gap
  sysHistAt=now;
  sysHist.push({cpu:s.cpu&&s.cpu.frac,ram:s.ram&&s.ram.frac,busy:s.disk&&s.disk.busy,down:s.net&&s.net.down,up:s.net&&s.net.up});
  while(sysHist.length>SYS_HISTORY) sysHist.shift();
}
// A 120 x 24 box, newest sample at the right edge; returns the line and the area under it
function sparkPaths(key,max){
  const dx=120/(SYS_HISTORY-1), off=SYS_HISTORY-sysHist.length, Y=24;
  let l='', a='', seg=[];
  const flush=()=>{
    if(!seg.length) return;
    if(seg.length===1) seg.push([seg[0][0]+0.6,seg[0][1]]); // a lone sample still leaves a dot
    const pts=seg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
    l+='M'+pts; a+='M'+seg[0][0].toFixed(1)+' '+Y+'L'+pts+'L'+seg[seg.length-1][0].toFixed(1)+' '+Y+'Z';
    seg=[];
  };
  sysHist.forEach((e,i)=>{
    const v=e&&e[key];
    if(v==null){ flush(); return; }
    seg.push([(off+i)*dx,(Y-1)-Math.min(1,v/max)*(Y-3)]);
  });
  flush();
  return {l,a};
}
function sparkSlot(key){
  const cur=sysHist.length?sysHist[sysHist.length-1]:null, v=cur&&cur[key];
  return {c:v==null?DIM:tone(v),...sparkPaths(key,1)};
}
function netSparkSlot(){
  let max=125000; // 1 Mb/s, so an idle line stays flat instead of a magnified trickle
  for(const e of sysHist) if(e) max=Math.max(max,e.down||0,e.up||0);
  return {c:'#e8e8ea',...sparkPaths('down',max),l2:sparkPaths('up',max).l};
}

// ---- Pill ----
function setText(el,t){ if(el.textContent!==t) el.textContent=t; }
function buildSysPill(){
  const on=sysMetrics;
  sysEl.hidden=!on.length;
  sysEl.dataset.n=String(on.length);
  sysEl.innerHTML=on.map(m=>m==='net'
    ? `<div class="sm sm-net" data-m="net"><div class="sm-n"><i>↓</i><span></span></div><div class="sm-n"><i>↑</i><span></span></div></div>`
    : `<div class="sm" data-m="${m}"><div class="sm-t"><span class="sm-l">${m==='cpu'?'CPU':m==='ram'?'RAM':'DISK'}</span><span class="sm-v"></span></div><div class="sm-b"><i></i></div></div>`).join('');
  sysRefs={};
  for(const m of on){
    const el=sysEl.querySelector(`[data-m="${m}"]`);
    sysRefs[m]=m==='net'?{el,d:el.children[0].lastChild,u:el.children[1].lastChild}
      :{el,l:el.querySelector('.sm-l'),v:el.querySelector('.sm-v'),b:el.querySelector('.sm-b i')};
  }
  updateSysPill();
}
function updateSysPill(){
  const s=sysSnap;
  for(const m of sysMetrics){
    const r=sysRefs[m]; if(!r) continue;
    if(m==='net'){
      const n=s.net, on=!!(n&&n.connected);
      r.el.classList.toggle('off',!!n&&!on);
      r.el.classList.toggle('testing',!!(speedSnap&&speedSnap.state==='running'));
      if(!n){ setText(r.d,'—'); setText(r.u,'—'); }
      else if(!on){ setText(r.d,sysText('pillOffline')); setText(r.u,''); }
      else{ setText(r.d,n.down!=null?bitsCompact(n.down):'—'); setText(r.u,n.up!=null?bitsCompact(n.up):'—'); }
      continue;
    }
    const d=s[m];
    setText(r.v,d?pctInt(d.frac):'—');
    r.b.style.width=d?(d.frac*100).toFixed(0)+'%':'0';
    r.b.style.background=d?tone(d.frac):'';
    if(m==='disk') setText(r.l,diskWord(d));
  }
}

// ---- Card ----
function sysSpark(key,two){
  return `<svg class="spark" viewBox="0 0 120 24" preserveAspectRatio="none" data-k="${key}"><path class="sp-a"/><path class="sp-l"/>${two?'<path class="sp-l2"/>':''}</svg>`;
}
const barSlot=f=>f==null?{w:0}:{w:f*100,bg:tone(f)};
// Markup with no numbers in it, plus the slots that hold them; the markup doubles as the signature of the card's shape
function buildSysCard(){
  const s=sysSnap, slots={};
  let h=`<div class="c-head"><svg class="sysg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8.5h3l1.5-4.5 3 8 1.5-3.5h4"/></svg><span class="c-title">${sysText('title')}</span></div>`;
  for(const m of sysMetrics){
    if(m==='cpu'){
      const c=s.cpu;
      h+=`<div class="win"><div class="w-row"><span class="w-label">${sysText('cpu')}</span><span class="w-val" data-k="cpu.v"></span></div>
        <div class="w-track"><div class="w-fill" data-k="cpu.b"></div></div>${sysSpark('cpu.s')}<div class="w-used" data-k="cpu.d"></div></div>`;
      slots['cpu.v']={t:c?pctInt(c.frac):'—'};
      slots['cpu.b']=barSlot(c&&c.frac);
      slots['cpu.s']=sparkSlot('cpu');
      slots['cpu.d']={t:c?[cpuName(c.name),c.threads?sysText('threads',c.threads):''].filter(Boolean).join(' · '):''};
    }else if(m==='ram'){
      const r=s.ram;
      h+=`<div class="win"><div class="w-row"><span class="w-label">${sysText('ram')}</span><span class="w-val" data-k="ram.v"></span></div>
        <div class="w-track"><div class="w-fill" data-k="ram.b"></div></div>${sysSpark('ram.s')}<div class="w-used" data-k="ram.d"></div></div>`;
      slots['ram.v']={t:r?pctInt(r.frac):'—'};
      slots['ram.b']=barSlot(r&&r.frac);
      slots['ram.s']=sparkSlot('ram');
      slots['ram.d']={t:r&&r.used!=null&&r.total
        ?sysText('usedOf',fmtSize(r.used),fmtSize(r.total))+' · '+sysText('free',fmtSize(Math.max(0,r.total-r.used))):''};
    }else if(m==='disk'){
      const d=s.disk, allOthers=d?d.others:[], others=allOthers.slice(0,SYS_DRIVE_ROWS); // the card is clipped, not scrolled: the rest are counted
      const hasBusy=!!d&&d.busy!=null, hasRw=!!d&&(d.read!=null||d.write!=null);
      h+=`<div class="win"><div class="w-row"><span class="w-label" data-k="disk.l"></span><span class="w-val" data-k="disk.v"></span></div>
        <div class="w-track"><div class="w-fill" data-k="disk.b"></div></div><div class="w-used" data-k="disk.d"></div>`
        +(hasBusy?sysSpark('disk.s'):'')
        +(hasBusy?`<div class="w-used" data-k="disk.a"></div>`:'')
        +(hasRw?`<div class="w-used" data-k="disk.rw"></div>`:'')
        +others.map((o,i)=>`<div class="w-used" data-k="disk.o${i}"></div>`).join('')+moreRow(allOthers.length-others.length)+`</div>`;
      slots['disk.l']={t:d?(diskWord(d)==='DISK'?sysText('disk'):diskWord(d))+(d.drive?` (${d.drive})`:''):sysText('disk')};
      slots['disk.v']={t:d?pctInt(d.frac):'—'};
      slots['disk.b']=barSlot(d&&d.frac);
      slots['disk.d']={t:d&&d.used!=null&&d.total
        ?sysText('usedOf',fmtSize(d.used),fmtSize(d.total))+' · '+sysText('free',fmtSize(Math.max(0,d.total-d.used))):''};
      if(hasBusy){
        slots['disk.s']=sparkSlot('busy');
        slots['disk.a']={t:sysText('active',Math.round(d.busy*100))};
      }
      if(hasRw){ // spaces inside an item are hard, so a narrow card breaks between the two and not in the middle of one
        const parts=[];
        if(d.read!=null) parts.push(sysText('read',byteRate(d.read)));
        if(d.write!=null) parts.push(sysText('write',byteRate(d.write)));
        slots['disk.rw']={t:parts.map(p=>p.replace(/ /g,'\u00a0')).join(' · ')};
      }
      others.forEach((o,i)=>{
        slots['disk.o'+i]={t:`${o.drive} ${pctInt(o.frac)}`+(o.used!=null&&o.total?' · '+sysText('usedOf',fmtSize(o.used),fmtSize(o.total)):'')};
      });
    }else if(m==='net'){
      const n=s.net;
      h+=`<div class="win"><div class="w-row"><span class="w-label">${sysText('net')}</span></div>`;
      if(!n) h+=`<div class="w-used">—</div>`;
      else if(!n.connected) h+=`<div class="w-used">${sysText('offline')}</div>`;
      else{
        h+=`<div class="w-used" data-k="net.a"></div>
          <div class="w-row" style="margin-top:6px"><span class="w-label"><i class="dot" style="background:#e8e8ea"></i>${sysText('down')}</span><span class="w-val" data-k="net.d"></span></div>
          <div class="w-row" style="margin-top:2px"><span class="w-label"><i class="dot" style="background:#808080"></i>${sysText('up')}</span><span class="w-val" data-k="net.u"></span></div>
          ${sysSpark('net.s',true)}`;
        const kind=n.kind==='wifi'?'Wi-Fi':n.kind==='ethernet'?'Ethernet':'';
        const parts=[n.name];
        if(kind&&!n.name.toLowerCase().includes(kind.toLowerCase())) parts.push(kind);
        if(n.link) parts.push(linkSpeed(n.link));
        slots['net.a']={t:parts.filter(Boolean).join(' · ')};
        slots['net.d']={t:n.down!=null?bitsRate(n.down*8):'—'};
        slots['net.u']={t:n.up!=null?bitsRate(n.up*8):'—'};
        slots['net.s']=netSparkSlot();
      }
      h+=`</div>`;
      const sp=speedSnap;
      if(sp){
        const run=sp.state==='running';
        h+=`<div class="c-sessions"><div class="w-row"><span class="w-label">${sysText('speed')}</span>`
          +(run?`<span class="w-val" data-k="st.live"></span>`:`<span class="lnk" role="button" data-act="speedtest">${sysText('testNow')}</span>`)+`</div>`;
        if(run){
          h+=`<div class="w-used" data-k="st.phase"></div><div class="w-track"><div class="w-fill" style="background:#e8e8ea" data-k="st.bar"></div></div><div class="w-used" data-k="st.part"></div>`;
          slots['st.live']={t:sp.live!=null?bitsRate(sp.live):''};
          slots['st.phase']={t:sysText('phase')[sp.phase]||sysText('phase')._};
          slots['st.bar']={w:sp.progress*100};
          const got=[];
          if(sp.ms!=null) got.push(nf(sp.ms,sp.ms<10?1:0)+' ms');
          if(sp.down!=null) got.push('↓ '+bitsRate(sp.down));
          if(sp.up!=null) got.push('↑ '+bitsRate(sp.up));
          slots['st.part']={t:got.join(' · ')};
        }else{
          if(sp.state==='error'&&sp.error){ h+=`<div class="w-used err" data-k="st.err"></div>`; slots['st.err']={t:sysText('failed',sysText('speedErr',sp.error))}; }
          if(sp.last){
            h+=`<div class="st-res"><span data-k="st.dn"></span><span data-k="st.up"></span><span data-k="st.ms"></span></div><div class="w-used" data-k="st.ago"></div>`;
            slots['st.dn']={t:'↓ '+bitsRate(sp.last.down)};
            slots['st.up']={t:'↑ '+bitsRate(sp.last.up)};
            slots['st.ms']={t:sp.last.ms!=null?nf(sp.last.ms,sp.last.ms<10?1:0)+' ms':''};
            slots['st.ago']={t:agoText(sp.last.at)};
          }else h+=`<div class="w-used">${sysText('never')}</div>`;
        }
        h+=`</div>`;
      }
    }
  }
  return {html:h,slots};
}
function patchSlot(el,v){
  if(v.t!==undefined) setText(el,v.t);
  if(v.w!==undefined) el.style.width=v.w.toFixed(1)+'%';
  if(v.bg!==undefined) el.style.background=v.bg;
  if(v.l!==undefined){ // a sparkline: area, line and (internet) a second line
    const [a,l,l2]=el.children;
    el.style.color=v.c;
    a.setAttribute('d',v.a); l.setAttribute('d',v.l);
    if(l2) l2.setAttribute('d',v.l2);
  }
}
function renderSysCard(){
  const {html,slots}=buildSysCard();
  if(html!==sysSig){
    card.innerHTML=html; sysSig=html; sysEls={};
    for(const el of card.querySelectorAll('[data-k]')) sysEls[el.dataset.k]=el;
  }
  for(const k in slots){ if(sysEls[k]) patchSlot(sysEls[k],slots[k]); }
}
function noteCardSize(){ cardSize=card.offsetWidth+'x'+card.offsetHeight; }
// A tick can change the card's height (a line appears, the test starts): place it again and report the new rectangles,
// but only then, since every report costs the Rust side a hit-test rebuild
function syncCardSize(){
  const k=card.offsetWidth+'x'+card.offsetHeight;
  if(k===cardSize) return;
  cardSize=k; placeCard(); reportHot();
}
const sysCardOpen=()=>card.classList.contains('show')&&hoverId==='system';
// "Test now" acts on mouseup, through the card: a tick that rewrites the link between the press and the release
// would swallow a click, but the release still lands on whatever link is there by then
card.addEventListener('mouseup',e=>{
  if(e.button!==0||!e.target||!e.target.closest||!e.target.closest('[data-act="speedtest"]')) return;
  Promise.resolve().then(()=>invoke('run_speedtest')).catch(()=>{});
});

// ---- Wiring ----
// How busy the processor and the disk are swings with the load from one second to the next, and a number that
// hops 30 points a tick cannot be read. A short moving average (weight 0.4 on each new second, about two seconds
// of memory) keeps it steady and still live. Space, memory and the speeds are shown as measured.
const SYS_SMOOTH=0.4;
let sysEma={cpu:null,busy:null};
function smoothed(key,v){
  const prev=sysEma[key];
  return sysEma[key]=prev==null?v:prev+SYS_SMOOTH*(v-prev);
}
function onSysmon(p,seed){ // `seed` = the answer to get_sysmon at start: shown, but neither history nor proof of a live sampler
  const n=normSys(p); if(!n||(seed&&sysAt>0)) return; // a late answer must not overwrite a live sample
  if(!seed){
    if(sysAt&&Date.now()-sysAt>3500) sysEma={cpu:null,busy:null}; // the sampler idled: do not blend across the gap
    if(n.cpu) n.cpu.frac=smoothed('cpu',n.cpu.frac); else sysEma.cpu=null;
    if(n.disk&&n.disk.busy!=null) n.disk.busy=smoothed('busy',n.disk.busy); else sysEma.busy=null;
  }
  sysSnap=n;
  if(!seed){ sysAt=Date.now(); pushHist(n); sysEl.classList.remove('stale'); }
  updateSysPill();
  if(sysCardOpen()){ renderSysCard(); syncCardSize(); }
}
function onSpeed(p){
  const n=normSpeed(p); if(!n) return;
  speedSnap=n;
  updateSysPill();
  if(sysCardOpen()){ renderSysCard(); syncCardSize(); }
}
function setSysMetrics(v){
  if(!Array.isArray(v)) return;
  const next=SYS_IDS.filter(id=>v.includes(id));
  if(next.join()===sysMetrics.join()) return;
  sysMetrics=next;
  buildSysPill();
  const onSys=hoverId==='system';
  // Also while the card is closed: a press on the pill's padding opens whatever hoverId names, and the block is gone
  if(onSys&&!next.length) hoverId=providers()[0].id;
  if(card.classList.contains('show')){
    if(onSys) renderCard();
    armWatchdog();
  }
  reportHot(); // the pill grew or shrank
}
// A throwing invoke or listener (a stub, a half-installed build) must not stop the rest of the page
function sysAsk(cmd,fn){ try{ Promise.resolve(invoke(cmd)).then(fn).catch(()=>{}); }catch(e){} }
function sysListen(name,fn){
  try{ listen(name,e=>{ try{ fn(e&&e.payload); }catch(err){ jslog(name+' handler: '+err); } }).catch(()=>{}); }catch(e){}
}
setInterval(()=>sysEl.classList.toggle('stale',sysAt>0&&Date.now()-sysAt>4000),2000);

// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  const open=card.classList.contains('show');
  const rects=open?[rectOf(pill),rectOf(tail),rectOf(card)]:[rectOf(pill)];
  callq('set_hot',{rects,expanded:open}).catch(()=>{});
}
function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): Rust sizes and zooms the window so this page is 360 CSS px wide
// (720 on the flat edges, where the pill is a row), so if the CSS viewport is not that wide the WebView's DPR disagrees with
// the monitor; CSS zoom pulls the layout back to the design size. Dividing a flat window by 360 made every measurement
// 1.4x too big and pushed the card 1.4x too far from the pill.
function designWidth(){ return edgeIsVertical()?360:720; }
function fitZoom(){
  const z=innerWidth/designWidth();
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  // On the flat edges the cells stand side by side and the System group is shorter than the rings: by its own rectangle alone, the
  // bands of pill above and below it belonged to no cell, so pointing there opened (or kept) the card of whatever was hovered before,
  // and a press there opened that provider's page. Along a flat pill the column decides and the whole height of the pill counts.
  const flat=!edgeIsVertical(), p=flat?pill.getBoundingClientRect():null;
  if(flat&&(y<p.top||y>=p.bottom)) return null;
  for(const el of pill.querySelectorAll('.cell')){
    if(el.hidden) continue; // a hidden cell's empty rect sits at 0,0
    const r=el.getBoundingClientRect();
    if(flat?(x>=r.left-6&&x<r.right+6):inRect(x,y,r,6)) return el.dataset.p;
  }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (opens the provider's usage page). */
let press=null, dragging=false;
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging) invoke('open_provider_page',{provider:press.id}).catch(()=>{});
  press=null;
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('usage',e=>{usage=e.payload||usage;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('grok',e=>{grokSnap=e.payload||grokSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_grok').then(u=>{grokSnap=u||grokSnap;renderRing();}).catch(()=>{});

listen('antigravity',e=>{agSnap=e.payload||agSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
invoke('get_notch_slots').then(v=>{if(Array.isArray(v)){notchSlots=v;renderRing();}}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
invoke('get_weekly_ring').then(v=>{if(typeof v==='string'){weeklyRing=v;renderRing();}}).catch(()=>{});
listen('weekly_ring',e=>{if(typeof e.payload==='string'){weeklyRing=e.payload;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});
invoke('get_notch_edge').then(applyEdge).catch(()=>{});
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
// System block. An older Rust side answers none of these and the block simply stays hidden.
sysListen('sys_metrics',setSysMetrics);
sysListen('sysmon',p=>onSysmon(p,false));
sysListen('speedtest',onSpeed);
sysAsk('get_sys_metrics',setSysMetrics);
sysAsk('get_sysmon',p=>onSysmon(p,true));
sysAsk('get_speedtest',onSpeed);
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
